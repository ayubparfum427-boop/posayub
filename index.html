<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1410">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<title>Atir POS</title>
<style>
:root{--g:#0b5d3b;--g1:#0f7a4c;--g2:#e6f2ec;--gold:#c9a24b;--gold2:#e3c67a;--ink:#13181b;--bg:#f5f3ee;--line:#e9e5db;--m:#7a8079;--r:#b4372b;--sh:0 1px 2px rgba(19,24,27,.04),0 10px 30px -12px rgba(19,24,27,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(15,122,76,.12)}
label{display:block;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--m);margin:10px 0 4px;font-weight:600}
.serif{font-family:'Playfair Display',Georgia,serif}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.btn{border:0;background:linear-gradient(135deg,var(--g1),var(--g));color:#fff;padding:11px 18px;border-radius:11px;cursor:pointer;font-weight:600;box-shadow:0 4px 14px -4px rgba(11,93,59,.55);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn.s{padding:6px 11px;font-size:13px;border-radius:9px}.btn.o{background:#fff;color:var(--g);border:1px solid #cfe3d8;box-shadow:none}
.btn.d{background:linear-gradient(135deg,#c9483a,var(--r));box-shadow:0 4px 14px -4px rgba(180,55,43,.5)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a2008;box-shadow:0 6px 20px -6px rgba(201,162,75,.7)}
.btn.xl{padding:16px 30px;font-size:17px;border-radius:14px}.btn:disabled{opacity:.4;pointer-events:none}
#app{display:flex;min-height:100vh}
nav{width:232px;background:linear-gradient(180deg,#0f1c16,#09120e);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;flex:none}
nav .logo{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:21px;padding:6px 10px 2px;color:var(--gold2);letter-spacing:.02em}
nav .tag2{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#6f8a7d;padding:0 10px 18px}
nav button{background:none;border:0;color:#b6c4bc;text-align:left;padding:11px 12px;border-radius:11px;cursor:pointer;font-size:14.5px;display:flex;align-items:center;gap:11px;position:relative;transition:.15s}
nav button:hover{background:rgba(255,255,255,.05);color:#fff}
nav button.on{background:linear-gradient(90deg,rgba(201,162,75,.2),rgba(201,162,75,.04));color:var(--gold2)}
nav button.on:before{content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
nav .who{margin-top:auto;font-size:12px;color:#8ea298;padding:12px;border-top:1px solid rgba(255,255,255,.08)}
nav .who b{color:#fff;font-size:14px;display:block}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(201,162,75,.16);color:var(--gold2);padding:4px 10px;border-radius:30px;font-size:12px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.chip:before{content:'';width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
main{flex:1;padding:26px 28px;min-width:0;max-width:1400px;perspective:1400px}
h2{margin:0 0 16px;font-size:27px;font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:-.01em}
h3{font-family:'Playfair Display',Georgia,serif}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.row>.fit{flex:none;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.prod{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.18s;box-shadow:var(--sh);position:relative;overflow:hidden}
.prod:before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),transparent)}
.prod:hover{transform:translateY(-3px);border-color:#d6c28a}
.prod b{display:block;font-size:15.5px;font-family:'Playfair Display',Georgia,serif}.prod small{color:var(--m)}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;background:var(--g2);color:var(--g);margin:0 4px 4px 0;font-weight:600}
.tag.r{background:#fbe9e6;color:var(--r)}.tag.y{background:#fff3d6;color:#8a6200}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--m);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.kassa{display:grid;grid-template-columns:1fr 390px;gap:18px}
.cart{position:sticky;top:20px;align-self:start}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.line:last-child{border:0}
.tot{font-size:26px;font-weight:700;color:var(--g);font-family:'Playfair Display',Georgia,serif}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat>div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.stat small{color:var(--m);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat b{display:block;font-size:22px;margin-top:4px;font-family:'Playfair Display',Georgia,serif}
#modal{position:fixed;inset:0;background:rgba(8,14,11,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;display:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(900px 500px at 15% 0%,rgba(15,122,76,.5),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(201,162,75,.22),transparent 60%),#08110d;perspective:800px}
.login{width:100%;max-width:370px;text-align:center;padding:30px 26px;border-radius:26px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);color:#fff}
.login .mk{width:62px;height:62px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gold);color:var(--gold2)}
.login .mk svg{width:28px;height:28px}
.login h1{margin:0 0 2px;font-family:'Playfair Display',Georgia,serif;color:var(--gold2);font-size:28px}
.login p{color:#9bb0a5;margin:0 0 16px;font-size:13px}
.login select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}.login select option{color:#000}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.pin button{padding:15px;font-size:20px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;border-radius:14px;cursor:pointer}
.pin button:active{background:rgba(201,162,75,.3)}
.dots{font-size:26px;letter-spacing:10px;height:38px;color:var(--gold2)}
.seg{display:inline-flex;gap:4px;background:#ebe8df;padding:4px;border-radius:12px;margin-bottom:12px;max-width:100%;overflow:auto}
.seg button{padding:8px 14px;border:0;background:none;border-radius:9px;cursor:pointer;font-weight:600;color:#59605b;white-space:nowrap}.seg button.on{background:#fff;color:var(--g);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sync{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.1);color:#aab7b0;display:inline-block}.sync.ok{background:rgba(74,222,128,.15);color:#86efac}.sync.er{background:rgba(248,113,113,.18);color:#fca5a5}
.hero{border-radius:24px;padding:30px;color:#fff;background:radial-gradient(500px 260px at 90% 0%,rgba(201,162,75,.3),transparent 60%),linear-gradient(135deg,#0f7a4c,#08301f 70%);box-shadow:0 20px 50px -20px rgba(8,48,31,.7);margin-bottom:16px;text-align:center;position:relative;overflow:hidden;animation:heroIn .5s ease}
.hero::after{content:'';position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 300deg,rgba(255,255,255,.09) 330deg,transparent 360deg);animation:spin 7s linear infinite;pointer-events:none}
.hero>*{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes heroIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotateY(-10deg)}50%{transform:translateY(-9px) rotateY(10deg)}}
.flask3d,.mk{animation:floaty 5.5s ease-in-out infinite;transform-style:preserve-3d}
@keyframes popIn{from{opacity:0;transform:translateY(7px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.stat>div{animation:popIn .4s ease both}
.stat>div:nth-child(1){animation-delay:.02s}.stat>div:nth-child(2){animation-delay:.06s}.stat>div:nth-child(3){animation-delay:.1s}.stat>div:nth-child(4){animation-delay:.14s}.stat>div:nth-child(5){animation-delay:.18s}
.card,.prod{transition:transform .15s ease-out,box-shadow .15s ease-out}
.chartbox{position:relative;height:230px;margin-top:4px}
.chartbox.sm{height:180px}
@media(max-width:900px){main{perspective:none}.card,.prod{transition:none}}
.hero .st{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2)}
.hero .tm{font-family:'Playfair Display',Georgia,serif;font-size:64px;font-weight:700;letter-spacing:.02em;margin:8px 0;font-variant-numeric:tabular-nums;line-height:1.1}
.hero p{margin:0 0 18px;color:#b7d3c5}
.hero .btn.o{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.rt{width:120px!important;text-align:right;padding:7px 9px}
.pimg{height:118px;margin:-14px -14px 10px;background:linear-gradient(135deg,#eef5f1,#f7f1e1);display:flex;align-items:center;justify-content:center;color:#b9c9c0;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}.pimg svg.i{width:38px;height:38px;stroke-width:1.3}
.thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#eef5f1;flex:none;display:flex;align-items:center;justify-content:center;color:#b9c9c0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.upl{display:flex;align-items:center;gap:12px;margin-top:6px}.upl .thumb{width:84px;height:84px;border-radius:16px}
.pm{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;transition:.15s}
.pm.on{border-color:var(--g1);background:#f3faf6}
.pm .h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-weight:600}
.pm .h a{font-size:12px;color:var(--g);font-weight:600;text-decoration:none;cursor:pointer}
.pm input{padding:9px 10px}
.qrbox{text-align:center;padding:8px 0}.qrbox svg{width:190px;height:190px;border:6px solid #fff;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.cardn{font-family:'Inter',monospace;font-size:19px;letter-spacing:.08em;font-weight:700}
.pf{color:#0b5d3b;font-weight:700}.pf.neg{color:var(--r)}
#receipt{font-family:monospace;font-size:13px;width:100%}#receipt hr{border:0;border-top:1px dashed #000}
@media(max-width:900px){
 #app{flex-direction:column}
 nav{width:100%;height:auto;position:fixed;bottom:0;left:0;right:0;top:auto;flex-direction:row;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;gap:2px;border-top:1px solid rgba(255,255,255,.1)}
 nav .logo,nav .who,nav .tag2{display:none}
 nav button{flex-direction:column;gap:3px;padding:8px 10px;font-size:10.5px;min-width:62px;text-align:center;justify-content:center}nav button.on:before{display:none}
 main{padding:16px 12px 96px}.kassa{grid-template-columns:1fr}.cart{position:static}
 h2{font-size:23px}.hero .tm{font-size:50px}
}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0;width:72mm}}
</style>
</head>

function tiltMove(e){
  const el=e.target.closest&&e.target.closest('.card,.prod');if(!el)return;
  const r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-0.5,py=(e.clientY-r.top)/r.height-0.5;
  el.style.transform=`perspective(700px) rotateX(${(-py*6).toFixed(2)}deg) rotateY(${(px*8).toFixed(2)}deg) translateZ(2px)`;
  el.style.boxShadow=`${(-px*16).toFixed(0)}px ${(14-py*8).toFixed(0)}px 26px -12px rgba(19,24,27,.22)`;
}
function tiltLeave(e){const el=e.target.closest&&e.target.closest('.card,.prod');if(el){el.style.transform='';el.style.boxShadow=''}}
if(typeof matchMedia==='function'&&matchMedia('(pointer:fine)').matches){
  document.addEventListener('pointermove',tiltMove);
  document.addEventListener('mouseleave',tiltLeave,true);
}
function animateCounters(root){
  (root||document).querySelectorAll('.cnum[data-val]').forEach(el=>{
    const target=parseFloat(el.dataset.val)||0,isMoney=el.dataset.fmt!=='num',fn=isMoney?fmt:fmtNum,t0=performance.now(),dur=650;
    function step(t){
      const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
      el.textContent=fn(target*e);
      if(p<1)requestAnimationFrame(step);else el.textContent=fn(target);
    }
    requestAnimationFrame(step);
  });
}
const CH={};
function mkChart(id,config){
  if(typeof Chart==='undefined')return;
  const el=document.getElementById(id);if(!el)return;
  if(CH[id]){CH[id].destroy();delete CH[id]}
  CH[id]=new Chart(el.getContext('2d'),config);
}
function dailySeries(days){
  const out=[],now=new Date();now.setHours(0,0,0,0);
  for(let i=days-1;i>=0;i--){
    const d0=now.getTime()-i*864e5,d1=d0+864e5;
    const rev=S.sales.filter(s=>s.date>=d0&&s.date<d1).reduce((a,s)=>a+s.total,0);
    out.push({label:new Date(d0).getDate()+'.'+(new Date(d0).getMonth()+1),rev});
  }
  return out;
}

const KINDS=['users','products','customers','sales','stock','debts','settings','shifts','reqs'];
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let S=LS.get('pos_data',null)||{};
KINDS.forEach(k=>S[k]=S[k]||[]);
let pending=LS.get('pos_pending',{});
let remote=LS.get('pos_remote',{url:'',key:''});
let syncState='lokal';
const REMOTE=()=>remote.url&&remote.key;
const H=()=>({apikey:remote.key,Authorization:'Bearer '+remote.key,'Content-Type':'application/json'});
const persist=()=>{LS.set('pos_data',S);LS.set('pos_pending',pending)};

function put(kind,item){
  const i=S[kind].findIndex(x=>x.id===item.id);
  if(i>=0)S[kind][i]=item;else S[kind].push(item);
  pending[kind+':'+item.id]={op:'put',kind,item};persist();flush();
}
function del(kind,id){
  S[kind]=S[kind].filter(x=>x.id!==id);
  pending[kind+':'+id]={op:'del',kind,id};persist();flush();
}
let flushing=false;
async function flush(){
  if(!REMOTE()||flushing)return;flushing=true;
  try{
    for(const [key,p] of Object.entries(pending)){
      let r;
      if(p.op==='put')r=await fetch(remote.url+'/rest/v1/records?on_conflict=id',{method:'POST',headers:{...H(),Prefer:'resolution=merge-duplicates'},body:JSON.stringify({id:key,kind:p.kind,data:p.item,updated_at:new Date().toISOString()})});
      else r=await fetch(remote.url+'/rest/v1/records?id=eq.'+encodeURIComponent(key),{method:'DELETE',headers:H()});
      if(!r.ok)throw new Error(await r.text());
      delete pending[key];persist();
    }
    setSync('ok');
  }catch(e){console.warn(e);setSync('er')}
  flushing=false;
}
let lastSig='';
async function pull(){
  if(!REMOTE())return;
  try{
    await flush();
    const r=await fetch(remote.url+'/rest/v1/records?select=id,kind,data&limit=100000',{headers:H()});
    if(!r.ok)throw new Error(await r.text());
    const rows=await r.json();
    const next=Object.fromEntries(KINDS.map(k=>[k,[]]));
    rows.forEach(x=>{if(next[x.kind]&&!pending[x.id])next[x.kind].push(x.data)});
    Object.entries(pending).forEach(([k,p])=>{if(p.op==='put'&&next[p.kind])next[p.kind].push(p.item)});
    const sig=JSON.stringify(next);
    setSync('ok');
    if(sig!==lastSig){lastSig=sig;S=next;persist();ensureSeed();onDataChanged()}
  }catch(e){console.warn(e);setSync('er')}
}
function setSync(s){syncState=s;const e=$('#sync');if(e){e.className='sync '+(s==='ok'?'ok':s==='er'?'er':'');e.textContent=s==='ok'?'● onlayn':s==='er'?'● xato':'● lokal'}}
function onDataChanged(){
  if(!user||modalOpen())return;
  if(view==='kassa'&&$('#grid'))renderGrid();else render();
}

const volOf=p=>p.vol||100;
const costMl=p=>(p.cost||0)/volOf(p);
const flk=p=>Math.floor((p.stock||0)/volOf(p)+1e-9);
function stockTxt(p){const f=flk(p),r=+((p.stock||0)-f*volOf(p)).toFixed(2);return f>0?`${f} flakon${r>0?' + '+r+' ml':''}`:`${r} ml`}
function migrate(){
  S.products.forEach(p=>{
    if(p.stock!==undefined&&p.vol)return;
    const vol=p.vol||100;
    const q={...p,vol,stock:+(((p.fStock||0)*vol)+(p.mStock||0)).toFixed(2),cost:p.cost!==undefined?p.cost:(p.fCost||Math.round((p.mCost||0)*vol)||0)};
    ['fStock','mStock','fCost','mCost'].forEach(k=>delete q[k]);
    put('products',q);
  });
}

async function tgCall(method,params){
  const c=cfg();if(!c.tgToken)return {ok:false,description:'token yo‘q'};
  try{
    const r=await fetch(`https://api.telegram.org/bot${c.tgToken}/${method}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)});
    return await r.json();
  }catch(e){return {ok:false,description:String(e)}}
}

  navigator.geolocation.getCurrentPosition(
    pos=>{tgSend(c.tgAdmin,base);tgLoc(c.tgAdmin,pos.coords.latitude,pos.coords.longitude)},
    ()=>{tgSend(c.tgAdmin,base+'\n📍 Joylashuvga ruxsat berilmadi')},

}

const HR=36e5;
const openShift=id=>S.shifts.find(s=>s.uid===id&&!s.end);
const shMs=s=>Math.max(0,(s.end||Date.now())-s.start);
const shPay=s=>shMs(s)/HR*(s.rate||0);
const dur=ms=>{const m=Math.floor(ms/6e4);return Math.floor(m/60)+' soat '+String(m%60).padStart(2,'0')+' daq'};
const clk=ms=>{const t=Math.floor(Math.max(0,ms)/1000);return [Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(x=>String(x).padStart(2,'0')).join(':')};
function rangeOf(p){
  const n=new Date(),s=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(p==='bugun')return s.getTime();
  if(p==='hafta')return s.getTime()-6*864e5;
  if(p==='oy')return new Date(n.getFullYear(),n.getMonth(),1).getTime();
  return 0;
}
function sumShifts(list){return {ms:list.reduce((a,s)=>a+shMs(s),0),pay:list.reduce((a,s)=>a+shPay(s),0)}}

function dots(){const d=$('#dots');if(d)d.textContent='•'.repeat(pinBuf.length)}
function pinKey(k){
  if(k==='⌫')pinBuf=pinBuf.slice(0,-1);
  else if(k==='OK')return tryLogin();
  else if(pinBuf.length<6)pinBuf+=k;
  dots();
  if(pinBuf.length>=4&&k!=='⌫'){const u=S.users.find(x=>x.id===$('#lu').value);if(u&&u.pin===pinBuf)tryLogin()}
}
function tryLogin(){
  const u=S.users.find(x=>x.id===$('#lu').value);
  if(u&&u.pin===pinBuf){user=u;LS.set('pos_user',u);pinBuf='';view=u.role==='director'?'hisobot':'ish';render()}
  else{toast("PIN noto'g'ri");pinBuf='';dots()}
}

function addModal(id){

function amMode(m){
  _am.mode=m;const p=prod(_am.id);
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#amlab').textContent=m==='flakon'?'Soni (flakon)':'Miqdor (ml)';

  $('#quick').innerHTML=m==='ml'?[3,5,10,20,50].map(v=>`<button class="btn o s" onclick="$('#amq').value=${v}">${v} ml</button>`).join(''):'';
  setTimeout(()=>$('#amq')?.focus(),50);

const mlNeed=pid=>cart.filter(c=>c.pid===pid).reduce((a,c)=>a+c.qty*(c.mode==='flakon'?volOf(prod(pid)):1),0);
function amAdd(){
  const p=prod(_am.id),m=_am.mode,qty=num($('#amq').value);
  if(qty<=0)return toast('Miqdorni kiriting');
  const need=qty*(m==='flakon'?volOf(p):1);
  if(need+mlNeed(p.id)>p.stock+1e-9)return toast(`Omborda yetarli emas (${p.stock} ml)`);
  const ex=cart.find(c=>c.pid===p.id&&c.mode===m);
  if(ex)ex.qty+=qty;else cart.push({pid:p.id,mode:m,qty});
  closeModal();renderCart();
}
const price=c=>{const p=prod(c.pid);return c.mode==='flakon'?p.fPrice:p.mPrice};
const costOf=c=>{const p=prod(c.pid);return c.mode==='flakon'?(p.cost||0):costMl(p)};
function calc(){
  const sub=cart.reduce((a,c)=>a+price(c)*c.qty,0);
  const d=Math.min(disc,sub);
  const bonusAvail=cust?(S.customers.find(x=>x.id===cust)?.bonus||0):0;
  const ub=Math.min(useBonus,bonusAvail,sub-d);
  return {sub,d,ub,total:sub-d-ub};
}

  <div style="display:flex;justify-content:space-between;margin-top:12px"><span>Jami</span><b>${fmt(t.sub)}</b></div>
  ${t.d?`<div style="display:flex;justify-content:space-between"><span>Chegirma</span><b>−${fmt(t.d)}</b></div>`:''}
  ${t.ub?`<div style="display:flex;justify-content:space-between"><span>Bonus</span><b>−${fmt(t.ub)}</b></div>`:''}
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><span>To'lash</span><span class="tot">${fmt(t.total)}</span></div>
  <div class="row" style="margin-top:12px"><button class="btn o fit" onclick="clearCart()">Tozalash</button><button class="btn" ${cart.length?'':'disabled'} onclick="payModal()">To'lov →</button></div>`;
}

   sub:t.sub,disc:t.d,bonusUsed:t.ub,total:t.total,cash:v.c-v.change,qr:v.q,card:v.k,debt:v.debt,bonusEarned:cs?earned:0};

  if(cs){put('customers',{...cs,bonus:cs.bonus-t.ub+earned,last:Date.now()})}

    f:p.fPrice?flk(p)*(p.fPrice-(p.cost||0)):0,
    m:p.mPrice?(p.stock||0)*(p.mPrice-cm):0};
}

  ${cost?`<td class="n">${p.fPrice?`<small style="color:var(--m)">flakonda</small> <b class="pf ${s.f<0?'neg':''}">${sg(s.f)}</b>`:''}${p.fPrice&&p.mPrice?'<br>':''}${p.mPrice?`<small style="color:var(--m)">razlivda</small> <b class="pf ${s.m<0?'neg':''}">${sg(s.m)}</b>`:''}</td>`:''}
  <td class="n"><button class="btn o s" onclick="prodModal('${p.id}')">Tahrir</button></td></tr>`}).join('')||'<tr><td colspan=5 style="color:var(--m)">Hali atir yo‘q</td></tr>'}</table></div>`;

function profHint(){
  const el=$('#phint');if(!el)return;
  const vol=num($('#e10').value)||100,st=num($('#e9').value),fp=num($('#e4').value),mp=num($('#e7').value);
  let html=`<div class="line"><span>Qoldiq</span><b>${st} ml (${flk({stock:st,vol})} flakon${(st-flk({stock:st,vol})*vol)>0?' + '+(+(st-flk({stock:st,vol})*vol).toFixed(2))+' ml':''})</b></div>`;
  if($('#e5')){
    const cost=num($('#e5').value),cm=cost/vol,pf=fp-cost,pm=mp-cm;
    html+=`<div class="line"><span>Tannarx 1 ml</span><b>${fmt(cm)}</b></div>`;
    if(fp)html+=`<div class="line"><span>Butun flakon foydasi</span><b class="pf ${pf<0?'neg':''}">${sg(pf)} (${pctOf(pf,cost)})</b></div>`;
    if(mp)html+=`<div class="line"><span>Razliv foydasi 1 ml ga</span><b class="pf ${pm<0?'neg':''}">${sg(pm)} (${pctOf(pm,cm)})</b></div>`;
    if(fp)html+=`<div class="line"><span>Kutilayotgan foyda · flakonda</span><b class="pf ${pf<0?'neg':''}">${sg(Math.floor(st/vol+1e-9)*pf)}</b></div>`;
    if(mp)html+=`<div class="line"><span>Kutilayotgan foyda · razlivda</span><b class="pf ${pm<0?'neg':''}">${sg(st*pm)}</b></div>`;
  }
  if(fp&&mp&&vol*mp>fp)html+=`<div style="font-size:12.5px;color:#8a6200;padding:8px 0">Eslatma: ${vol} ml ni razlivda sotsangiz ${fmt(vol*mp)} bo‘ladi, butun flakon narxi esa ${fmt(fp)}.</div>`;
  el.innerHTML=`<div style="background:#f3faf6;border:1px solid #cfe3d8;border-radius:12px;padding:6px 12px">${html}</div>`;
}

}

  modal(`<h3 style="margin:0">Kirim / tuzatish</h3>
  <label>Atir</label><select id="k1">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock} ml)</option>`).join('')}</select>
  <div class="row"><div><label>Turi</label><select id="k2"><option value="flakon">Flakon (dona)</option><option value="ml">Ml</option></select></div><div><label>Miqdor (− bo'lsa kamayadi)</label><input id="k3" type="number"></div></div>
  ${cost?`<label>Shu kirimning tannarxi (1 flakon uchun, ixtiyoriy)</label><input id="k5" type="number" placeholder="masalan 140000"><small style="color:var(--m)">Kiritsangiz, ombordagi tannarx o‘rtacha qilib yangilanadi.</small>`:''}

function kirimSave(){
  const p={...prod($('#k1').value)},m=$('#k2').value,q=num($('#k3').value);if(!q)return toast('Miqdorni kiriting');
  const ml=m==='flakon'?q*volOf(p):q;
  if((p.stock||0)+ml<-1e-9)return toast('Omborda bundan kam atir bor');
  const c=$('#k5')?num($('#k5').value):0;
  if(c>0&&ml>0){const old=Math.max(0,p.stock||0);p.cost=Math.round((old*costMl(p)+ml*(c/volOf(p)))/(old+ml)*volOf(p))}
  p.stock=+((p.stock||0)+ml).toFixed(2);
  put('products',p);put('stock',{id:uid(),date:Date.now(),pid:p.id,name:p.name,mode:m,qty:q,ml,note:$('#k4').value,user:user.name,cost:c||null});
  closeModal();render();toast('Kirim qo‘shildi');
}

/* ================= XODIMLAR (faqat direktor) ================= */
let xper='oy';
const PER=['bugun','hafta','oy','hammasi'];
const perBtns=(cur,fn)=>`<div class="seg">${PER.map(p=>`<button class="${cur===p?'on':''}" onclick="${fn}('${p}')">${p[0].toUpperCase()+p.slice(1)}</button>`).join('')}</div>`;
function setXper(p){xper=p;render()}
function vXodim(){
  const from=rangeOf(xper),cost=canSeeCost();
  const rows=S.users.map(u=>{
    const sh=S.shifts.filter(s=>s.uid===u.id&&s.start>=from);
    const sales=S.sales.filter(s=>s.cashierId===u.id&&s.date>=from);
    const {ms,pay}=sumShifts(sh),rev=sales.reduce((a,s)=>a+s.total,0);
    return {u,o:openShift(u.id),ms,pay,n:sh.length,rev,sc:sales.length,perHour:ms>0?rev/(ms/HR):0,ratio:rev>0?pay/rev*100:0};
  });
  const tot=rows.reduce((a,r)=>({ms:a.ms+r.ms,pay:a.pay+r.pay,rev:a.rev+r.rev}),{ms:0,pay:0,rev:0});
  const working=rows.filter(r=>r.o).length;
  const pending=(S.reqs||[]).filter(r=>r.status==='kutilmoqda').sort((a,b)=>b.date-a.date);
  return `<h2>Xodimlar</h2>
  ${pending.length?`<div class="card"><b>Tuzatish so'rovlari (${pending.length})</b>${pending.map(r=>{const s=S.shifts.find(x=>x.id===r.sid);return `<div class="line"><div><b>${esc(r.name)}</b><br><small style="color:var(--m)">${s?dt(s.start)+(s.end?' → '+tm(s.end):' → davom etmoqda'):'smena topilmadi'}</small><br>${esc(r.text)}</div><div style="text-align:right;white-space:nowrap">${s?`<button class="btn o s" onclick="shiftModal('${s.id}','${s.uid}')">Tuzatish</button> `:''}<button class="btn o s" onclick="reqResolve('${r.id}')">Yopish</button></div></div>`}).join('')}</div>`:''}
  <div class="stat"><div><small>Hozir ishda</small><b>${working} / ${S.users.length}</b></div><div><small>Jami ishlangan vaqt</small><b>${dur(tot.ms)}</b></div><div><small>Jami hisoblangan haq</small><b class="cnum" data-val="${tot.pay}">${fmt(tot.pay)}</b></div>${cost?`<div><small>Jami savdo (ular qilgan)</small><b class="cnum" data-val="${tot.rev}">${fmt(tot.rev)}</b></div>`:''}</div>
  ${perBtns(xper,'setXper')}
  <div class="card" style="overflow:auto"><table><tr><th>Xodim</th><th>Holat</th><th class="n">Soatlik haq</th><th class="n">Ishlangan</th><th class="n">Hisoblangan haq</th>${cost?'<th class="n">Savdo</th><th class="n">Soatiga savdo</th><th class="n">Haq/savdo</th>':''}<th></th></tr>
  ${rows.map(r=>`<tr><td><b>${esc(r.u.name)}</b><br><small style="color:var(--m)">${ROLES[r.u.role]}</small></td>
   <td>${r.o?`<span class="tag">ishda · ${tm(r.o.start)} dan</span>`:'<small style="color:var(--m)">ishda emas</small>'}</td>
   <td class="n"><input class="rt" type="number" inputmode="numeric" value="${r.u.rate||''}" placeholder="0" onchange="setRate('${r.u.id}',this.value)"></td>
   <td class="n">${dur(r.ms)}<br><small style="color:var(--m)">${r.n} smena</small></td><td class="n"><b>${fmt(r.pay)}</b></td>
   ${cost?`<td class="n"><b>${fmt(r.rev)}</b><br><small style="color:var(--m)">${r.sc} chek</small></td><td class="n">${fmt(r.perHour)}</td><td class="n">${r.rev>0?r.ratio.toFixed(1)+'%':'—'}</td>`:''}
   <td class="n" style="white-space:nowrap"><button class="btn o s" onclick="xodimInfo('${r.u.id}')">Smenalar</button> <button class="btn o s" onclick="userModal('${r.u.id}')">Tahrir</button></td></tr>`).join('')}
  </table></div>
  ${cost&&rows.some(r=>r.rev>0||r.pay>0)?`<div class="card"><b>Xodimlar samaradorligi</b><p style="color:var(--m);font-size:13px;margin:4px 0 10px">Har xodim qilgan savdo va unga to'langan haq — kim samaraliroq ishlayotganini solishtiring.</p><div class="chartbox"><canvas id="chStaff"></canvas></div></div>`:''}
  <button class="btn" onclick="userModal()">+ Yangi xodim</button>
  <p style="color:var(--m);font-size:13px;margin-top:14px">Soatlik haq o'zgartirilsa, u hozir davom etayotgan va keyingi smenalarga qo'llanadi. Yopilgan smenalar eski narxda qoladi (kerak bo'lsa "Smenalar"da alohida tahrirlang).</p>
  ${permCard()}`;
}
function renderXodimCharts(){
  if(!canSeeCost())return;
  const from=rangeOf(xper);
  const rows=S.users.map(u=>{
    const sales=S.sales.filter(s=>s.cashierId===u.id&&s.date>=from);
    const {pay}=sumShifts(S.shifts.filter(s=>s.uid===u.id&&s.start>=from));
    return {name:u.name,rev:sales.reduce((a,s)=>a+s.total,0),pay};
  }).filter(r=>r.rev>0||r.pay>0);
  if(!rows.length)return;
  mkChart('chStaff',{type:'bar',data:{labels:rows.map(r=>r.name),datasets:[
    {label:'Savdo',data:rows.map(r=>r.rev),backgroundColor:'#0f7a4c',borderRadius:8,maxBarThickness:42},
    {label:'Xodim haqi',data:rows.map(r=>r.pay),backgroundColor:'#c9a24b',borderRadius:8,maxBarThickness:42}
  ]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:700,easing:'easeOutQuart'},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{family:'Inter'}}}},scales:{y:{ticks:{callback:v=>fmtNum(v)}},x:{grid:{display:false}}}}});
}
function setRate(id,v){

  <button class="btn o" style="margin-top:12px" onclick="closeModal()">Yopish</button>`);

function forceEnd(sid,uidv){const s=S.shifts.find(x=>x.id===sid);if(!s)return;put('shifts',{...s,end:Date.now()});xodimInfo(uidv);toast('Smena tugatildi')}
const toLocal=ms=>{const d=new Date(ms-new Date(ms).getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)};
const splitLocal=ms=>{const [d,t]=toLocal(ms).split('T');return {d,t}};
function reqResolve(id){const r=(S.reqs||[]).find(x=>x.id===id);if(!r)return;put('reqs',{...r,status:'hal qilindi'});render();toast('Yopildi')}
function shiftModal(sid,uidv){
  const u=S.users.find(x=>x.id===uidv);
  const s=sid?S.shifts.find(x=>x.id===sid):{start:Date.now()-8*HR,end:Date.now(),rate:u.rate||0};
  window._sh={sid,uidv};
  const st=splitLocal(s.start),et=s.end?splitLocal(s.end):null;
  const quick=(id,vals)=>vals.map(v=>`<button type="button" class="btn o s fit" onclick="$('#${id}').value='${v}';shiftPreview()">${v}</button>`).join(' ');
  modal(`<h3 style="margin:0 0 2px">${sid?'Smenani tahrirlash':'Smena qo‘shish'}</h3><p style="color:var(--m);margin:0 0 10px">${esc(u.name)}</p>
  <label>Sana</label><input id="hd" type="date" value="${st.d}" oninput="shiftPreview()">
  <div class="row"><div><label>Kelgan vaqti</label><input id="h1" type="time" value="${st.t}" oninput="shiftPreview()"><div class="row" style="margin-top:6px">${quick('h1',['08:00','09:00','10:00'])}</div></div>
  <div><label>Ketgan vaqti</label><input id="h2" type="time" value="${et?et.t:''}" ${et?'':'disabled'} oninput="shiftPreview()"><div class="row" style="margin-top:6px">${quick('h2',['18:00','20:00','22:00'])}</div></div></div>
  <label style="display:flex;align-items:center;gap:8px;margin-top:12px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"><input type="checkbox" id="hopen" style="width:18px;height:18px" ${et?'':'checked'} onchange="$('#h2').disabled=this.checked;if(this.checked)$('#h2').value='';shiftPreview()"> Hali ham ishda (tugamagan)</label>
  <label>Soatlik haq (so'm)</label><input id="h3" type="number" value="${s.rate||0}" oninput="shiftPreview()">
  <div id="hprev" style="margin-top:12px;background:#f3faf6;border:1px solid #cfe3d8;border-radius:12px;padding:9px 13px;font-size:14px"></div>
  <div class="row" style="margin-top:14px">${sid?`<button class="btn d fit" onclick="if(confirm('Smena o‘chirilsinmi?')){del('shifts','${sid}');xodimInfo('${uidv}');render()}">O'chirish</button>`:''}<button class="btn o" onclick="xodimInfo('${uidv}')">Orqaga</button><button class="btn" onclick="shiftSave()">Saqlash</button></div>`);
  shiftPreview();
}
function shiftPreview(){
  const el=$('#hprev');if(!el)return;
  const d=$('#hd').value,t1=$('#h1').value,open=$('#hopen').checked,t2=$('#h2').value,rate=num($('#h3').value);
  if(!d||!t1){el.innerHTML='Sana va kelgan vaqtini kiriting';return}
  const a=new Date(d+'T'+t1).getTime();
  if(open||!t2){el.innerHTML='Smena ochiq qoladi (hali tugamagan)';return}
  const b=new Date(d+'T'+t2).getTime();
  if(b<=a){el.innerHTML='<span style="color:var(--r)">Ketgan vaqt kelgan vaqtdan keyin bo‘lishi kerak</span>';return}
  el.innerHTML=`Ishlagan vaqt: <b>${dur(b-a)}</b> · Hisoblangan haq: <b>${fmt((b-a)/HR*rate)}</b>`;
}
function shiftSave(){
  const {sid,uidv}=window._sh,u=S.users.find(x=>x.id===uidv);
  const d=$('#hd').value,t1=$('#h1').value,open=$('#hopen').checked,t2=$('#h2').value;
  if(!d||!t1)return toast('Sana va kelgan vaqtini kiriting');
  const a=new Date(d+'T'+t1).getTime();
  const b=(open||!t2)?null:new Date(d+'T'+t2).getTime();
  if(!a||(b!==null&&(!b||b<=a)))return toast('Vaqtlarni to‘g‘ri kiriting');
  if(b===null&&openShift(uidv)&&(!sid||openShift(uidv).id!==sid))return toast('Bu xodimda ochiq smena bor');
  const old=sid?S.shifts.find(x=>x.id===sid):{id:uid(),uid:uidv,name:u.name};
  put('shifts',{...old,start:a,end:b,rate:num($('#h3').value)});
  (S.reqs||[]).filter(r=>r.sid===old.id&&r.status==='kutilmoqda').forEach(r=>put('reqs',{...r,status:'hal qilindi'}));
  xodimInfo(uidv);render();toast('Saqlandi');
}

/* ================= HISOBOT ================= */
let per='bugun';
function setPer(p){per=p;render()}
function vHisobot(){
  const from=rangeOf(per),ss=S.sales.filter(s=>s.date>=from);
  const rev=ss.reduce((a,s)=>a+s.total,0);
  const cogs=ss.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.cost*i.qty,0),0);
  const sum=k=>ss.reduce((a,s)=>a+(s[k]||0),0);
  const dp=S.debts.flatMap(d=>(d.hist||[]).filter(h=>h.date>=from&&d.type==='customer'));
  const byC={},byP={};
  ss.forEach(s=>{byC[s.cashier]=(byC[s.cashier]||0)+s.total;s.items.forEach(i=>{const k=i.name;byP[k]=byP[k]||{sum:0,f:0,ml:0};byP[k].sum+=i.qty*i.price;if(i.mode==='flakon')byP[k].f+=i.qty;else byP[k].ml+=i.qty})});
  const cost=canSeeCost();
  const wages=cost?sumShifts(S.shifts.filter(s=>s.start>=from)).pay:0;
  const debtGroup=type=>{
    const g={};
    S.debts.filter(d=>d.type===type).forEach(d=>{const left=d.amount-d.paid;if(left>0.5)g[d.partyName]=(g[d.partyName]||0)+left});
    return Object.entries(g).sort((a,b)=>b[1]-a[1]);
  };
  const owedToUs=debtGroup('customer'),weOwe=debtGroup('supplier');
  const owedToUsTot=owedToUs.reduce((a,[,v])=>a+v,0),weOweTot=weOwe.reduce((a,[,v])=>a+v,0);
  return `<h2>Hisobot</h2>${perBtns(per,'setPer')}
  <div class="stat"><div><small>Savdo</small><b class="cnum" data-val="${rev}">${fmt(rev)}</b></div><div><small>Cheklar</small><b class="cnum" data-val="${ss.length}" data-fmt="num">${ss.length}</b></div>${cost?`<div><small>Foyda (tannarxdan)</small><b class="cnum" data-val="${rev-cogs}">${fmt(rev-cogs)}</b></div><div><small>Xodimlar haqi</small><b class="cnum" data-val="${wages}">${fmt(wages)}</b></div><div><small>Foyda − xodim haqi</small><b>${fmt(rev-cogs-wages)}</b></div>`:''}<div><small>O'rtacha chek</small><b class="cnum" data-val="${ss.length?rev/ss.length:0}">${fmt(ss.length?rev/ss.length:0)}</b></div></div>
  <div class="stat"><div><small>Naqd</small><b class="cnum" data-val="${sum('cash')}">${fmt(sum('cash'))}</b></div><div><small>QR kod</small><b class="cnum" data-val="${sum('qr')}">${fmt(sum('qr'))}</b></div><div><small>Karta raqam</small><b class="cnum" data-val="${sum('card')}">${fmt(sum('card'))}</b></div><div><small>Nasiya</small><b class="cnum" data-val="${sum('debt')}">${fmt(sum('debt'))}</b></div><div><small>Qarz to'lovlari</small><b class="cnum" data-val="${dp.reduce((a,h)=>a+h.amount,0)}">${fmt(dp.reduce((a,h)=>a+h.amount,0))}</b></div></div>
  <div class="row" style="align-items:flex-start"><div class="card"><b>So'nggi 14 kunlik savdo</b><div class="chartbox"><canvas id="chRevenue"></canvas></div></div>
  <div class="card" style="max-width:320px;flex:none"><b>To'lov turlari</b><div class="chartbox sm"><canvas id="chPay"></canvas></div></div></div>
  <div class="row" style="align-items:flex-start"><div class="card"><b>Xodimlar bo'yicha savdo</b>${Object.entries(byC).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="line"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join('')||'<p style="color:var(--m)">—</p>'}</div>
  <div class="card"><b>Top atirlar</b>${Object.entries(byP).sort((a,b)=>b[1].sum-a[1].sum).slice(0,8).map(([k,v])=>`<div class="line"><span>${esc(k)}<br><small style="color:var(--m)">${v.f?v.f+' dona ':''}${v.ml?v.ml+' ml':''}</small></span><b>${fmt(v.sum)}</b></div>`).join('')||'<p style="color:var(--m)">—</p>'}</div></div>
  <div class="row" style="align-items:flex-start"><div class="card"><b>Bizga qarzdorlar</b><p style="color:var(--m);font-size:13px;margin:4px 0 8px">Mijozlar bizga qancha qarzi borligi (joriy holat)</p>${owedToUs.map(([k,v])=>`<div class="line"><span>${esc(k)}</span><b style="color:var(--r)">${fmt(v)}</b></div>`).join('')||'<p style="color:var(--m)">Hech kim qarzdor emas</p>'}${owedToUs.length?`<div class="line" style="border-top:1.5px solid var(--line);margin-top:4px"><span><b>Jami</b></span><b style="color:var(--r)">${fmt(owedToUsTot)}</b></div>`:''}</div>
  <div class="card"><b>Biz qarzdor ta'minotchilarga</b><p style="color:var(--m);font-size:13px;margin:4px 0 8px">Bizning ta'minotchilarga qarzimiz (joriy holat)</p>${weOwe.map(([k,v])=>`<div class="line"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join('')||'<p style="color:var(--m)">Qarzimiz yo‘q</p>'}${weOwe.length?`<div class="line" style="border-top:1.5px solid var(--line);margin-top:4px"><span><b>Jami</b></span><b>${fmt(weOweTot)}</b></div>`:''}</div></div>
  <div class="card" style="overflow:auto"><b>Cheklar</b><table>${[...ss].reverse().slice(0,100).map(s=>`<tr style="cursor:pointer" onclick="receipt(S.sales.find(x=>x.id==='${s.id}'))"><td>№${s.no}<br><small style="color:var(--m)">${dt(s.date)}</small></td><td>${esc(s.custName||'—')}<br><small style="color:var(--m)">${esc(s.cashier)}</small></td><td class="n"><b>${fmt(s.total)}</b></td></tr>`).join('')||'<tr><td>Savdo yo‘q</td></tr>'}</table></div>`;
}
function renderHisobotCharts(){
  const from=rangeOf(per),ss=S.sales.filter(s=>s.date>=from);
  const sum=k=>ss.reduce((a,s)=>a+(s[k]||0),0);
  const days=dailySeries(14);
  mkChart('chRevenue',{type:'line',data:{labels:days.map(d=>d.label),datasets:[{label:'Savdo',data:days.map(d=>d.rev),borderColor:'#0f7a4c',backgroundColor:'rgba(15,122,76,.12)',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:'#0f7a4c'}]},
   options:{responsive:true,maintainAspectRatio:false,animation:{duration:700,easing:'easeOutQuart'},plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>fmtNum(v)}},x:{grid:{display:false}}}}});
  const vals=[sum('cash'),sum('qr'),sum('card'),sum('debt')];
  mkChart('chPay',{type:'doughnut',data:{labels:['Naqd','QR kod','Karta','Nasiya'],datasets:[{data:vals,backgroundColor:['#0f7a4c','#c9a24b','#2b6cb0','#b4372b'],borderWidth:0}]},
   options:{responsive:true,maintainAspectRatio:false,animation:{duration:700,easing:'easeOutQuart'},plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{family:'Inter',size:11}}}},cutout:'62%'}});
}

/* ================= SOZLAMALAR ================= */
function vSozlama(){
  const c=cfg();
  return `<h2>Sozlamalar</h2><div class="card"><b>Do'kon</b>
  <label>Nomi</label><input id="s1" value="${esc(c.shop)}"><div class="row"><div><label>Telefon</label><input id="s2" value="${esc(c.phone)}"></div><div><label>Manzil</label><input id="s3" value="${esc(c.address)}"></div></div>
  <label>QR kod uchun to'lov havolasi (o'zingiz kiriting)</label><input id="s4" placeholder="https://..." value="${esc(c.qr)}"><div class="row"><div><label>Karta raqami</label><input id="s9" inputmode="numeric" placeholder="8600 0000 0000 0000" value="${esc(c.cardNo||'')}"></div><div><label>Karta egasi</label><input id="s10" value="${esc(c.cardName||'')}"></div></div>
  <div class="row"><div><label>Bonus (% xariddan)</label><input id="s5" type="number" value="${c.bonus}"></div><div><label>Kam qoldiq ogohlantirishi (ml)</label><input id="s7" type="number" value="${c.lowMl}"></div></div>
  <label>Kassa faqat ish boshlangandan keyin ochilsinmi?</label><select id="s8"><option value="0" ${!c.needShift?'selected':''}>Yo'q — har doim ochiq</option><option value="1" ${c.needShift?'selected':''}>Ha — xodim avval "Ishni boshlash"ni bosishi kerak</option></select>
  <button class="btn" style="margin-top:14px" onclick="setSave()">Saqlash</button></div>
  <div class="card"><b>Telegram bot</b>
  <p style="color:var(--m);font-size:13px;margin:4px 0 10px">@BotFather orqali bot yarating, tokenni shu yerga kiriting. O'zingizning (rahbar) chat ID'ingizni bilish uchun botga yozing, keyin @userinfobot orqali chat ID'ingizni oling.</p>
  <label>Bot token</label><input id="s11" value="${esc(c.tgToken||'')}" placeholder="123456789:ABC-...">
  <label>Rahbar chat ID (xodim ishga kelganda xabar shu yerga boradi)</label><input id="s12" value="${esc(c.tgAdmin||'')}" placeholder="masalan 123456789">
  <button class="btn" style="margin-top:12px" onclick="setSave()">Saqlash</button>
  <div class="row" style="margin-top:10px"><button class="btn o fit" onclick="tgTest()">Sinov xabari yuborish</button><button class="btn o fit" onclick="tgInboxModal()">Mijozlar xabarlari</button></div></div>
  <div class="card"><b>Xodimlar va soatlik haq</b><p style="color:var(--m);font-size:13px;margin:4px 0 10px">Xodim qo'shish, PIN va soatlik haqni "Xodimlar" bo'limida boshqarasiz.</p><button class="btn o" onclick="go('xodim')">Xodimlar bo'limiga o'tish</button></div>
  <div class="card"><b>Server (bir nechta qurilma sinxroni)</b><p style="color:var(--m);font-size:13px;margin:4px 0 10px">Hozir: ${REMOTE()?'Supabase ulangan':'faqat shu qurilmada (lokal)'}</p><button class="btn o" onclick="serverModal()">Serverni sozlash</button></div>
  <div class="card"><b>Zaxira nusxa</b><div class="row" style="margin-top:10px"><button class="btn o" onclick="backup()">Yuklab olish</button><label class="btn o" style="margin:0;text-transform:none;letter-spacing:0;font-size:15px;color:var(--g)">Tiklash<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label></div></div>`;
}
function setSave(){put('settings',{...cfg(),id:'main',shop:$('#s1').value||'ATIR POS',phone:$('#s2').value,address:$('#s3').value,qr:$('#s4').value.trim(),cardNo:$('#s9').value.trim(),cardName:$('#s10').value.trim(),bonus:num($('#s5').value),lowMl:num($('#s7').value),needShift:$('#s8').value==='1',tgToken:$('#s11').value.trim(),tgAdmin:$('#s12').value.trim()});render();toast('Saqlandi')}
function userModal(id){
  const u=id?S.users.find(x=>x.id===id):{name:'',role:'seller',pin:'',rate:0};window._ue=id;
  modal(`<h3 style="margin:0">${id?'Xodimni tahrirlash':'Yangi xodim'}</h3><label>Ism</label><input id="u1" value="${esc(u.name)}"><label>Lavozim</label><select id="u2">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select>
  <div class="row"><div><label>PIN (4-6 raqam)</label><input id="u3" inputmode="numeric" maxlength="6" value="${esc(u.pin)}"></div><div><label>1 soatlik haq (so'm)</label><input id="u4" type="number" inputmode="numeric" placeholder="masalan 6000" value="${u.rate||''}"></div></div>
  <div class="row" style="margin-top:14px">${id&&S.users.length>1?`<button class="btn d fit" onclick="if(confirm('Xodim o‘chirilsinmi?')){del('users','${id}');closeModal();render()}">O'chirish</button>`:''}<button class="btn o" onclick="closeModal()">Bekor</button><button class="btn" onclick="userSave()">Saqlash</button></div>`);
}
function userSave(){
  const name=$('#u1').value.trim(),pin=$('#u3').value.trim();
  if(!name||!/^\d{4,6}$/.test(pin))return toast('Ism va 4-6 raqamli PIN kerak');
  if(S.users.some(x=>x.pin===pin&&x.id!==window._ue))return toast('Bu PIN band');
  const old=window._ue?S.users.find(x=>x.id===window._ue):{};
  const u={...old,id:window._ue||uid(),name,role:$('#u2').value,pin,rate:Math.max(0,num($('#u4').value))};
  if(window._ue&&u.role!=='director'&&old.role==='director'&&S.users.filter(x=>x.role==='director').length<2)return toast('Kamida bitta direktor bo‘lishi kerak');
  put('users',u);
  const o=window._ue&&openShift(u.id);if(o&&o.rate!==u.rate)put('shifts',{...o,rate:u.rate});
  closeModal();render();toast('Saqlandi');
}
function serverModal(){
  modal(`<h3 style="margin:0">Supabase ulash</h3><p style="font-size:13px;color:var(--m)">supabase.sql ni ishga tushirgach, Project URL va anon key ni kiriting. Bo'sh qoldirsangiz — faqat lokal.</p>
  <label>Project URL</label><input id="r1" value="${esc(remote.url)}" placeholder="https://xxxx.supabase.co"><label>anon key</label><input id="r2" value="${esc(remote.key)}">
  <div class="row" style="margin-top:14px"><button class="btn o" onclick="closeModal()">Bekor</button><button class="btn" onclick="serverSave()">Ulash</button></div>`);
}
async function serverSave(){
  const url=$('#r1').value.trim().replace(/\/$/,''),key=$('#r2').value.trim();
  if(!url||!key){remote={url:'',key:''};LS.set('pos_remote',remote);setSync('lokal');closeModal();return toast('Lokal rejim')}
  try{
    const r=await fetch(url+'/rest/v1/records?select=id&limit=1',{headers:{apikey:key,Authorization:'Bearer '+key}});
    if(!r.ok)throw new Error(await r.text());
  }catch(e){return toast('Ulanmadi: jadval/kalitni tekshiring')}
  const hadLocal=KINDS.some(k=>S[k].length);
  remote={url,key};LS.set('pos_remote',remote);
  const r=await fetch(url+'/rest/v1/records?select=id&limit=1',{headers:H()});const rows=await r.json();
  if(!rows.length&&hadLocal){KINDS.forEach(k=>S[k].forEach(item=>{pending[k+':'+item.id]={op:'put',kind:k,item}}));persist()}
  lastSig='';closeModal();await pull();ensureSeed();render();toast('Ulandi');
}
function backup(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='pos-zaxira-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function restore(f){
  if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Joriy ma‘lumot almashtiriladi. Davom etasizmi?'))return;
    KINDS.forEach(k=>{S[k]=d[k]||[];S[k].forEach(i=>{pending[k+':'+i.id]={op:'put',kind:k,item:i}})});migrate();persist();flush();render();toast('Tiklandi')}catch{toast('Fayl xato')}};r.readAsText(f);
}

/* ================= ISHGA TUSHIRISH ================= */
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
ensureSeed();
if(user&&!S.users.find(x=>x.id===user.id))user=null;
if(user)view=user.role==='director'?'hisobot':'ish';
render();pull();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
